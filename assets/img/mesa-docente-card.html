<!--
  FONT de mesa-docente-card.png — la targeta social del lloc (og:image / twitter:image),
  la que es veu quan algú comparteix un article per WhatsApp, LinkedIn o X.

  Això NO es publica: està a `exclude` al _config.yml. Viu aquí, al costat del PNG que
  genera, perquè el PNG no es pot editar a mà. Si canvia el lema, la marca o els colors,
  es toca aquest fitxer i es torna a generar:

    "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless --disable-gpu
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630
      --virtual-time-budget=8000 --screenshot="<ruta>/mesa-docente-card.png"
      "file:///<ruta>/mesa-docente-card.html"

  (tot en una sola línia; --virtual-time-budget dóna temps a les Google Fonts a carregar,
  i sense ell la targeta surt amb la tipografia de reserva del sistema.)

  Els colors i les tipografies són els reals d'assets/css/style.css, no aproximacions:
  si allà canvia --brand o --btn-fg, aquí també han de canviar.
-->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
  /* Targeta social de Mesa Docente, 1200x630. Els colors surten de les variables
     reals del lloc (assets/css/style.css): --brand #2B3D33 i --btn-fg #F1ECDF.
     Fons sòlid de marca a propòsit: la targeta es veu sobre xats clars i foscos,
     i un fons paper es confondria amb el del client de missatgeria. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body {
    background:#2B3D33; color:#F1ECDF;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:38px; font-family:'Archivo', system-ui, sans-serif;
    /* Marge de seguretat: alguns clients escapcen cap al quadrat pel centre */
    padding:70px 150px;
  }
  .marca { display:block; }
  .nom {
    font-weight:700; font-size:68px; letter-spacing:.10em; text-transform:uppercase;
    line-height:1; text-align:center;
  }
  .filet { width:180px; height:2px; background:#8FB39C; opacity:.75; }
  .lema {
    font-family:'Source Serif 4', Georgia, serif; font-style:italic;
    font-size:31px; line-height:1.45; text-align:center; color:#C9D6CC; max-width:20ch;
  }
</style>
</head>
<body>
  <!-- Motiu «mesa»: mesa redonda vista des de dalt. Mateixa geometria que _includes/mesa-mark.html -->
  <svg class="marca" viewBox="0 0 36 36" width="162" height="162" aria-hidden="true">
    <circle cx="18" cy="18" r="11.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="28.6" cy="28.6" r="1.7" fill="currentColor"/>
    <circle cx="7.4" cy="28.6" r="1.7" fill="currentColor"/>
    <circle cx="7.4" cy="7.4" r="1.7" fill="currentColor"/>
    <circle cx="28.6" cy="7.4" r="1.7" fill="currentColor"/>
    <circle cx="33" cy="18" r="1.7" fill="currentColor"/>
    <circle cx="18" cy="33" r="1.7" fill="currentColor"/>
    <circle cx="3" cy="18" r="1.7" fill="currentColor"/>
    <circle cx="18" cy="3" r="1.7" fill="currentColor"/>
  </svg>
  <div class="nom">Mesa Docente</div>
  <div class="filet"></div>
  <p class="lema">IA y educación con mirada crítica, de docente a docente</p>
</body>
</html>
