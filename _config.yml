title: Mesa Docente
description: "IA y educación con mirada crítica, de docente a docente"
lang: es
# Domini propi (apex): baseurl buit perquè el lloc se serveix a l'arrel, no a /blog-docentes/
url: "https://mesadocente.com"
baseurl: ""

# Imatge de la targeta social (og:image / twitter:image). Sense això, compartir un article
# a WhatsApp o LinkedIn pinta una targeta NUA, només text: LinkedIn no accepta el títol per
# paràmetre, el treu d'aquestes meta.
#
# Va per `defaults` i NO per una clau `image:` d'arrel. Provat el 2026-08-29: amb
# `image:` al primer nivell, jekyll-seo-tag no emet cap `og:image` —llegeix la imatge de
# la PÀGINA, no del lloc—, i el build no es queixa: la meta simplement no hi és. Amb
# `defaults` cada pàgina neix amb `page.image` i sí que l'emet. Un `og:image` absent es
# detecta mirant l'HTML servit, no els logs.
#
# Hi va la MARCA i no el retrat: qui comparteix un article comparteix la publicació, i una
# cara sense context en una previsualització de WhatsApp desorienta més que ajuda.
# La targeta és 1200x630 —la proporció que esperen les xarxes— i el text hi queda dins del
# quadrat central, perquè els clients que escapcen no se n'emportin les vores.
# Es va generar amb Chrome headless a partir d'un HTML de disseny; si algun dia canvia el
# lema o la marca, cal tornar-la a generar (no és un fitxer que es pugui editar a mà).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/mesa-docente-card.png

# Autoria: PERSONA, no marca. Mesa Docente és la publicació; qui signa és una persona
# amb ORCID. Amb `name` de marca, el JSON-LD declarava `Person: "Mesa Docente"` —una marca
# disfressada de persona— i les credencials quedaven invisibles per a Google (E-E-A-T).
# El nom de firma és "Néstor Calbet" (sense el segon cognom); a l'ORCID hi consta el nom
# complet, i és el JSON-LD de /sobre/ qui els lliga amb `alternateName`. No treguis d'allà
# la forma completa: és la que fa que la persona d'aquí i la de l'ORCID siguin la mateixa.
author:
  name: "Néstor Calbet"
  # Pàgina d'autor. `jekyll-seo-tag` la publica com a `author.url` dins del JSON-LD de
  # CADA article (verificat a `json_ld_drop.rb`: agafa qualsevol clau d'aquest bloc).
  # És el pont: l'article apunta a /sobre/, i /sobre/ declara el `sameAs` cap a l'ORCID.
  url: "https://mesadocente.com/sobre/"
  # Credencials del peu de cada article. Han de dir el MATEIX que l'ORCID; si canvien allà,
  # canvien aquí.
  bio: "Doctor en Derechos Humanos, profesor de secundaria en activo y colaborador docente en la Universitat Oberta de Catalunya."
  # Identificador de persona (orcid.org/0009-0000-7900-1169). Si es buida aquesta línia,
  # el byline i el JSON-LD deixen de mostrar-lo sols, sense tocar cap plantilla.
  orcid: "0009-0000-7900-1169"

markdown: kramdown
permalink: /:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap   # genera /sitemap.xml automàticament (suportat de sèrie per GitHub Pages)

# Verificació de propietat de Google Search Console — jekyll-seo-tag ho converteix
# en <meta name="google-site-verification" ...> a l'<head>. No treure-ho mai (mantén la verificació).
google_site_verification: swNyEfqKqPBAqIyHvsdisd8X_7BZ8OlIki04tJaJrO4

# Analítica — descomenta UNA línia quan tinguis el compte creat, i fes push.
# El snippet corresponent (a _layouts/default.html) no es renderitza mentre això estigui comentat.
cf_analytics_token: "916a1eec55f8441c9126e7ffffb494fe"   # Cloudflare Web Analytics: gratis, sense cookies ni banner (ACTIU)
# plausible_domain: mesadocente.com     # Plausible: sense cookies ni banner, de pagament
# ga4_id: G-XXXXXXXXXX                  # Google Analytics 4: gratis, però a la UE demana avís de cookies

# Umami Cloud — NO és part de la cascada de dalt: s'activa a banda i conviu amb Cloudflare.
# Motiu de tenir-lo: Cloudflare Web Analytics no desglossa per campanya i el trànsit que ve
# d'un correu arriba sense referer → "quant em porta la newsletter" no es pot respondre amb ell.
# Umami llegeix els UTM. Enganxa aquí el Website ID d'umami.is i fes push.
# umami_website_id: "________-____-____-____-____________"
# umami_src: https://cloud.umami.is/script.js   # només si el compte és a la regió EU (canvia el host)

# jekyll-feed genera /feed.xml automàticament (clau per a l'RSS del blog)
feed:
  posts_limit: 20

exclude:
  - README.md
